[package]
name = "wawity-ports"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wawity-ports"
path = "src/main.rs"
test = true
bench = false

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["clipboard-write-text", "shell-open", "window-close", "window-minimize", "window-maximize", "window-unmaximize", "window-start-dragging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
igd = "0.12.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
socket2 = "0.5"
xmltree = "0.10"
tempfile = "3"
getrandom = "0.2"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
